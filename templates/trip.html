{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<h2>Vacation Planner</h2>

<div class="trip-container">
    <!-- Map & Controls -->
    <div class="map-section">
        <div class="trip-controls">
            <input type="text" id="search-input" class="trip-search-box" placeholder="Search for a place...">
            <select id="current-day-select" class="trip-select">
                <option value="0">Add to Day 1</option>
            </select>
        </div>
        <div id="map" class="trip-map"></div>
    </div>

    <!-- Itinerary -->
    <div class="itinerary-section">
        <button class="btn-add-day" onclick="addDay()">+ Add New Day</button>
        <div class="itinerary-scroll-area" id="itinerary-wrapper">
            <!-- Days will be dynamically injected here -->
        </div>
    </div>
</div>

<script>
    let map;
    let geocoder;
    let markers = [];
    let days = [ { id: 1, items: [] } ];
    
    const icons = {
        default: 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png',
        food: 'http://maps.google.com/mapfiles/ms/icons/orange-dot.png',
        home: 'http://maps.google.com/mapfiles/ms/icons/green-dot.png'
    };

    const emojis = { default: '📍', food: '🍔', home: '🏠' };

    // Google Maps Dark Mode styling array
    const darkModeStyles = [
        { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
    ];

    function initMap() {
        const isDarkMode = document.body.classList.contains('dark-mode'); // Adjust this class based on your app's dark mode toggle
        
        map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 49.1666, lng: -123.1336 },
            zoom: 12,
            mapTypeControl: false,
            styles: isDarkMode ? darkModeStyles : []
        });

        geocoder = new google.maps.Geocoder();
        const input = document.getElementById("search-input");
        const autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.bindTo("bounds", map);

        autocomplete.addListener("place_changed", () => {
            const place = autocomplete.getPlace();
            if (!place.geometry || !place.geometry.location) return;

            map.panTo(place.geometry.location);
            map.setZoom(15);
            
            const selectedDayIdx = document.getElementById("current-day-select").value;
            addLocation(place.geometry.location.lat(), place.geometry.location.lng(), place.name, place.formatted_address, 'default', selectedDayIdx);
            input.value = '';
        });

        map.addListener("click", (e) => {
            const placeName = prompt("Enter a name or note for this location:");
            if (placeName) geocodeLatLng(e.latLng, placeName);
        });

        renderItinerary();
    }

    function geocodeLatLng(latLng, name) {
        geocoder.geocode({ location: latLng }, (results, status) => {
            let address = "Address not found";
            if (status === "OK" && results[0]) address = results[0].formatted_address;
            const selectedDayIdx = document.getElementById("current-day-select").value;
            addLocation(latLng.lat(), latLng.lng(), name, address, 'default', selectedDayIdx);
        });
    }

    function addLocation(lat, lng, name, address, type, dayIndex) {
        days[dayIndex].items.push({ id: Date.now().toString(), lat, lng, name, address, type });
        renderItinerary();
    }

    function removeLocation(dayIndex, itemIndex) {
        days[dayIndex].items.splice(itemIndex, 1);
        renderItinerary();
    }

    function updateLocationType(dayIndex, itemIndex, newType) {
        days[dayIndex].items[itemIndex].type = newType;
        renderItinerary();
    }

    function addDay() {
        days.push({ id: days.length + 1, items: [] });
        updateDaySelect();
        renderItinerary();
    }

    function updateDaySelect() {
        const select = document.getElementById("current-day-select");
        select.innerHTML = '';
        days.forEach((day, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `Add to Day ${day.id}`;
            select.appendChild(opt);
        });
    }

    function centerMapOn(lat, lng) {
        map.panTo({ lat: lat, lng: lng });
        map.setZoom(16);
    }

    function clearMarkers() {
        markers.forEach(m => m.setMap(null));
        markers = [];
    }

    function renderItinerary() {
        clearMarkers();
        const wrapper = document.getElementById("itinerary-wrapper");
        wrapper.innerHTML = '';

        days.forEach((day, dayIndex) => {
            const dayDiv = document.createElement("div");
            dayDiv.className = "trip-day-container";
            dayDiv.innerHTML = `
                <div class="trip-day-header"><h4>Day ${day.id}</h4></div>
                <ul class="trip-day-list" id="day-list-${dayIndex}">
                    ${day.items.length === 0 ? '<div class="empty-day-state">Drag items here or add from map</div>' : ''}
                </ul>
            `;
            wrapper.appendChild(dayDiv);

            const listEl = document.getElementById(`day-list-${dayIndex}`);

            day.items.forEach((item, itemIndex) => {
                const marker = new google.maps.Marker({
                    position: { lat: item.lat, lng: item.lng }, map: map, title: item.name, icon: icons[item.type]
                });
                const infoWindow = new google.maps.InfoWindow({ content: `<b>${emojis[item.type]} ${item.name}</b><br>${item.address}` });
                marker.addListener("click", () => infoWindow.open(map, marker));
                markers.push(marker);

                const li = document.createElement("li");
                li.className = `trip-itinerary-item type-${item.type}`;
                li.setAttribute("data-id", item.id);
                li.innerHTML = `
                    <div class="item-header">
                        <div>
                            <p class="item-title" onclick="centerMapOn(${item.lat}, ${item.lng})">${emojis[item.type]} ${item.name}</p>
                            <div class="item-address">${item.address}</div>
                        </div>
                    </div>
                    <div class="item-actions">
                        <select class="trip-type-select" onchange="updateLocationType(${dayIndex}, ${itemIndex}, this.value)">
                            <option value="default" ${item.type === 'default' ? 'selected' : ''}>📍 Default</option>
                            <option value="food" ${item.type === 'food' ? 'selected' : ''}>🍔 Food</option>
                            <option value="home" ${item.type === 'home' ? 'selected' : ''}>🏠 Home/Hotel</option>
                        </select>
                        <button class="trip-btn-remove" onclick="removeLocation(${dayIndex}, ${itemIndex})">Remove</button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            new Sortable(listEl, {
                group: 'shared', animation: 150, ghostClass: 'sortable-ghost',
                onEnd: function (evt) {
                    const fromDayIdx = parseInt(evt.from.id.replace('day-list-', ''));
                    const toDayIdx = parseInt(evt.to.id.replace('day-list-', ''));
                    const movedItem = days[fromDayIdx].items.splice(evt.oldIndex, 1)[0];
                    days[toDayIdx].items.splice(evt.newIndex, 0, movedItem);
                    renderItinerary();
                },
            });
        });
    }
</script>

<!-- Google Maps API. Replace YOUR_GOOGLE_MAPS_API_KEY with your actual key -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAHWdBZZv4Lm7tYGhmc-EkHbJiV3eqroCw&libraries=places&callback=initMap" async defer></script>
{% endblock %}
